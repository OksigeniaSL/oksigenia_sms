name: oksigenia_sms
description: >-
  Permission-minimal Android SMS sender: sends one concatenated SMS using only
  SEND_SMS, no READ_PHONE_STATE. Works on Android 12-17 and GrapheneOS.
version: 0.1.1
repository: https://github.com/OksigeniaSL/oksigenia_sms
homepage: https://github.com/OksigeniaSL/oksigenia_sms
issue_tracker: https://github.com/OksigeniaSL/oksigenia_sms/issues
topics:
  - sms
  - android
  - telephony
  - messaging
  - emergency

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.oksigenia.oksigenia_sms
        pluginClass: OksigeniaSmsPlugin
